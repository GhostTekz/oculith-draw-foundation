name: Foundation installers

# Run the expensive package matrix only for a reviewed candidate, on demand,
# or weekly against main. Label events do not repeat on each PR push.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  pull_request:
    types: [labeled, ready_for_review]

concurrency:
  group: foundation-installers-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installers:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:installers') ||
      (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'ci:installers'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            bundle: deb
          - runner: windows-latest
            bundle: nsis
          - runner: macos-26
            bundle: app
    runs-on: ${{ matrix.runner }}
    env:
      # tesseract-rs hardcodes /MD. MSVC appends _CL_ after those flags, so
      # Windows C/C++ objects match the workspace's static Rust CRT.
      _CL_: ${{ matrix.bundle == 'nsis' && '/MT' || '' }}
      # Keep the host display stack outside the Linux AppImage.
      LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*;libxkbcommon.so*;libxcb-randr.so*;libxcb-render.so*;libxcb-shm.so*;libXau.so*;libXdmcp.so*'
    steps:
      - name: Preserve generated source bytes (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          # Audit receipts must name the commit that built the installer, not
          # GitHub's temporary pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Verify public source boundary
        working-directory: open-pdf-studio
        run: node scripts/community-export-verify.mjs --published
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libtesseract-dev libleptonica-dev pkg-config
      - name: Native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake nasm
      - name: Prepare runtime and build sidecar
        working-directory: open-pdf-studio
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --test scripts/pack-addon.test.mjs scripts/addon-manager.test.mjs js/core/edition-helper.test.mjs
          npm run prepare:native-runtime
          npm run prepare:ocr-runtime
          cargo build --release -p pdfium-worker
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          worker="../target/release/pdfium-worker"
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "${worker}${suffix}" "src-tauri/binaries/ocudraw-community-pdfium-worker-${triple}${suffix}"
      - name: Build installer
        working-directory: open-pdf-studio
        run: npm run tauri:community -- --bundles ${{ matrix.bundle }}
      - name: Install and start Foundation DEB (Ubuntu 22.04)
        if: matrix.bundle == 'deb'
        working-directory: open-pdf-studio
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ../target/community/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          package="$(realpath "$package")"
          docker run --rm \
            -v "$package:/input/foundation.deb:ro" \
            -v "$PWD/scripts/linux-deb-smoke.sh:/input/linux-deb-smoke.sh:ro" \
            ubuntu:22.04 \
            bash /input/linux-deb-smoke.sh /input/foundation.deb 10
      - name: Verify public editor bundle
        working-directory: open-pdf-studio
        run: node scripts/community-export-verify.mjs --published --bundle
      - name: Provide pinned linuxdeploy (Linux)
        if: matrix.bundle == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x "$tools/linuxdeploy-x86_64.AppImage"
      - name: Build AppImage (Linux)
        if: matrix.bundle == 'deb'
        working-directory: open-pdf-studio
        run: npm run tauri:community -- --bundles appimage
      - name: Start AppImage on Debian 13 (Linux)
        if: matrix.bundle == 'deb'
        working-directory: open-pdf-studio
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find ../target/community/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(realpath "$appimage")"
          docker run --rm \
            -v "$appimage:/input/oculith-draw.AppImage:ro" \
            -v "$PWD/scripts/linux-appimage-smoke.sh:/input/linux-appimage-smoke.sh:ro" \
            -v "$PWD/scripts/check-appimage-elf.py:/input/check-appimage-elf.py:ro" \
            debian:13-slim \
            bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dbus-x11 gvfs libegl1 libgles2 libgtk-3-0t64 python3 xauth xvfb && cp /input/oculith-draw.AppImage /tmp/oculith-draw.AppImage && bash /input/linux-appimage-smoke.sh /tmp/oculith-draw.AppImage 10'
      - name: Start AppImage on Fedora 44 (Linux)
        if: matrix.bundle == 'deb'
        working-directory: open-pdf-studio
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find ../target/community/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(realpath "$appimage")"
          docker run --rm \
            -v "$appimage:/input/oculith-draw.AppImage:ro" \
            -v "$PWD/scripts/linux-appimage-smoke.sh:/input/linux-appimage-smoke.sh:ro" \
            -v "$PWD/scripts/check-appimage-elf.py:/input/check-appimage-elf.py:ro" \
            fedora:44 \
            bash -lc 'dnf install -y --setopt=install_weak_deps=False dbus-daemon dbus-tools findutils gtk3 gvfs libwayland-client libwayland-cursor libwayland-egl libwayland-server libxcb libXau libXdmcp libxkbcommon mesa-libEGL libglvnd-gles python3 xorg-x11-server-Xvfb xorg-x11-xauth && cp /input/oculith-draw.AppImage /tmp/oculith-draw.AppImage && bash /input/linux-appimage-smoke.sh /tmp/oculith-draw.AppImage 10'
      - name: Check installer output
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/community/release/bundle"
          case "${{ matrix.bundle }}" in
            deb)
              test -n "$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
              test -n "$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
              ;;
            nsis) test -n "$(find "$bundle/nsis" -maxdepth 1 -name '*-setup.exe' -print -quit)" ;;
            app) test -n "$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)" ;;
          esac
      - name: Package macOS app for review
        if: matrix.bundle == 'app'
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/community/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          test -d "$app"
          archive="$bundle/$(basename "$app" .app).zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          test -s "$archive"
          unzip -tq "$archive"
      - name: Verify installed notices and public-only contents (Linux and macOS)
        if: matrix.bundle == 'deb' || matrix.bundle == 'app'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.bundle }}" == 'deb' ]]; then
            package="$(find target/community/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
            extracted="$(mktemp -d)"
            trap 'rm -rf "$extracted"' EXIT
            dpkg-deb --extract "$package" "$extracted"
            node open-pdf-studio/scripts/verify-foundation-package.mjs --root "$extracted" --artifact "$package" \
              --output target/community/release/bundle/foundation-package-audit-deb.json
            appimage="$(find target/community/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
            test -n "$appimage"
            appimage="$(realpath "$appimage")"
            extracted_appimage="$(mktemp -d)"
            trap 'rm -rf "$extracted" "$extracted_appimage"' EXIT
            (cd "$extracted_appimage" && "$appimage" --appimage-extract >/dev/null)
            node open-pdf-studio/scripts/verify-foundation-package.mjs --root "$extracted_appimage/squashfs-root" --artifact "$appimage" \
              --output target/community/release/bundle/foundation-package-audit-appimage.json
          else
            app="$(find target/community/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
            archive="${app%.app}.zip"
            test -s "$archive"
            extracted_app="$(mktemp -d)"
            trap 'rm -rf "$extracted_app"' EXIT
            ditto -x -k "$archive" "$extracted_app"
            test -d "$extracted_app/$(basename "$app")"
            node open-pdf-studio/scripts/verify-foundation-package.mjs --root "$extracted_app/$(basename "$app")" --artifact "$archive" \
              --output target/community/release/bundle/foundation-package-audit-app.json
          fi
      - name: Install and remove Foundation (Windows)
        if: matrix.bundle == 'nsis'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/target/community/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Foundation installer is missing' }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          $locations = @(
            "$env:ProgramFiles/Oculith Draw Foundation",
            "$env:LOCALAPPDATA/Oculith Draw Foundation"
          )
          $installed = $locations | Where-Object { Test-Path (Join-Path $_ 'ocudraw-community.exe') } | Select-Object -First 1
          if (-not $installed) {
            foreach ($key in @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Oculith Draw Foundation (User)',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Oculith Draw Foundation',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Oculith Draw Foundation'
            )) {
              $location = (Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallLocation
              if ($location -and (Test-Path (Join-Path $location.Trim('"') 'ocudraw-community.exe'))) {
                $installed = $location.Trim('"')
                break
              }
            }
          }
          if (-not $installed) { throw 'Installed Foundation executable is missing' }
          if (-not (Test-Path (Join-Path $installed 'ocudraw-community-pdfium-worker.exe'))) {
            throw 'Installed PDFium worker is missing'
          }
          & node "$env:GITHUB_WORKSPACE/open-pdf-studio/scripts/verify-foundation-package.mjs" --root "$installed" --artifact "$($setup.FullName)" --output "$env:GITHUB_WORKSPACE/target/community/release/bundle/foundation-package-audit-nsis.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Foundation notice or source-boundary audit failed' }
          $uninstaller = Join-Path $installed 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Foundation uninstaller is missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed: $($remove.ExitCode)" }
          if (Test-Path (Join-Path $installed 'ocudraw-community.exe')) { throw 'Foundation executable remained after uninstall' }
      - name: Upload installer for review
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ matrix.runner }}-${{ matrix.bundle }}
          path: target/community/release/bundle/
          if-no-files-found: error
          retention-days: 7
